name: Byg og udgiv medlemsdashboardet

# Kører hver gang noget ændrer sig i repoet — typisk når en ny månedsfil
# lægges i data/ultimo/. Læser alle Excel-ark, skriver public/data/members.json,
# bygger siden og udgiver den på GitHub Pages. Den selvstændige HTML-fil
# lægges som artifact på kørslen.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dp-medlemsdashboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Læs Excel-arkene og skriv members.json
        run: |
          pip install --quiet openpyxl
          python3 scripts/build_data.py

      # Den genererede datafil committes, så den også ligger i repoet og
      # kan læses uden at bygge. Generede filer vinder altid over det, der lå.
      - name: Commit members.json
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/members.json
          if git diff --staged --quiet; then
            echo "data uændret"
          else
            git commit -m "Opdater medlemsdata $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push origin HEAD:main || echo "push afvist — data ligger stadig i buildet"
          fi

      - name: Byg siden
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Byg den selvstændige fil
        run: |
          npm run build:single
          node scripts/make-singlefile.mjs dist-single/index.html public/data/members.json DP-medlemsdashboard.html

      - name: Upload den selvstændige fil
        uses: actions/upload-artifact@v4
        with:
          name: DP-medlemsdashboard
          path: DP-medlemsdashboard.html
          retention-days: 90

      - name: Konfigurer Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload siden
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Udgiv på Pages
        id: deploy
        if: steps.pages.outcome == 'success'
        uses: actions/deploy-pages@v4

      - name: Resultat
        run: |
          if [ "${{ steps.pages.outcome }}" = "success" ]; then
            echo "## Dashboardet er ude" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "${{ steps.deploy.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Pages kunne ikke slås til automatisk" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Slå det til manuelt: Settings → Pages → Source: GitHub Actions. Næste kørsel udgiver så af sig selv." >> "$GITHUB_STEP_SUMMARY"
          fi
